packages:
  - apps/*
  - packages/*

# pnpm 10 does not run dependency install scripts unless allow-listed.
# Only the native-binary packages that the toolchain needs are listed.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver

# next@15 pins postcss 8.4.31, which has open advisories; use the patched release.
overrides:
  next>postcss: ^8.5.31
